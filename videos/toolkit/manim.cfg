# Sample Space Manim config (render.sh passes this with --config_file).
[CLI]
background_color = #14161B
pixel_width = 1920
pixel_height = 1080
frame_rate = 30
progress_bar = none
# Partial movie files are re-encoded by postprocess.py, so make them near-lossless & fast.
[video_encoder.options]
crf = 12
preset = veryfast
